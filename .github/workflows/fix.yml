name: Fast Search Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-source:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Search for __ModuleLoader__ assignment and usage
        run: |
          echo "=== WHERE IS __ModuleLoader__ SET OR CALLED? ==="
          grep -rn "ModuleLoader" . --exclude-dir={node_modules,.git,dist} || true

      - name: Search exact line where .plugins is accessed
        run: |
          echo "=== ALL PURCHASES / ACCESSED .plugins PROPERTIES ==="
          grep -rn "\.plugins" apps/ --exclude-dir={node_modules,.git,dist} || true
          grep -rn "\.plugins" packages/ --exclude-dir={node_modules,.git,dist} || true

      - name: Inspect Package Exports
        run: |
          echo "=== PACKAGES IN MONOREPO ==="
          ls -la packages/ || true
          ls -la apps/ || true
          
