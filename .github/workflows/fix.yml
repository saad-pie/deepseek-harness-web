name: Fast Fix & Test Harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle only
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Test & Print Client Dist / Plugin Bundle Output
        run: |
          echo "=== DIST FILES GENERATED ==="
          ls -la ./apps/web/dist

          echo "=== SEARCHING FOR MODULE LOADER CALLS IN COMPILED JS ==="
          grep -rn "__ModuleLoader__" ./apps/web/dist/assets/ || true
          
          echo "=== CHECKING PACKAGES DIST STRUCTURE ==="
          ls -la packages/*/dist || true
          
