name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Inject ModuleLoader & Fix JS Errors
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          const htmlPath = path.join(distPath, "index.html");

          // 1. Copy built packages dist assets if present
          const packagesDir = "./packages";
          if (fs.existsSync(packagesDir)) {
            fs.readdirSync(packagesDir).forEach(pkg => {
              const pkgDist = path.join(packagesDir, pkg, "dist");
              if (fs.existsSync(pkgDist)) {
                fs.cpSync(pkgDist, distPath, { recursive: true, force: true });
              }
            });
          }

          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            // 2. Locate built client/loader scripts
            const files = fs.readdirSync(distPath);
            const loaderFile = files.find(f => f.includes("loader") || f.includes("client") || f.includes("bootstrap"));

            let scriptTag = "";
            if (loaderFile) {
              scriptTag = `<script src="/deepseek-harness-web/${loaderFile}"></script>\n`;
            }

            // 3. Complete ModuleLoader interface implementation
            const inlineShim = `
            <script>
              (function() {
                function createInstance() {
                  return {
                    load: function() { return Promise.resolve({}); },
                    register: function() {},
                    getPlugin: function() { return {}; },
                    plugins: {}
                  };
                }
                if (!window.__ModuleLoader__) {
                  window.__ModuleLoader__ = createInstance();
                  window.__ModuleLoader__.create = createInstance;
                }
              })();
            </script>
            `;

            html = html.replace("<head>", "<head>\n" + scriptTag + inlineShim);
            fs.writeFileSync(htmlPath, html);
            console.log("Successfully injected ModuleLoader into index.html");
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
