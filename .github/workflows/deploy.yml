name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build All Monorepo Packages
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          # Build all monorepo packages so loader/boot bundles are compiled
          pnpm run build

          # Build web client specifically with subpath base
          pnpm --filter @deepseek-ai/dsh-web run build -- --base=/deepseek-harness-web/ || \
          pnpm --filter web run build -- --base=/deepseek-harness-web/ || \
          pnpm --filter ./apps/web run build -- --base=/deepseek-harness-web/

      - name: Sync Root Modules and Patch HTML Bootstrap
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // Determine target dist directory
          let distPath = "./apps/web/dist";
          if (!fs.existsSync(distPath)) {
            if (fs.existsSync("./packages/web/dist")) distPath = "./packages/web/dist";
            else if (fs.existsSync("./dist")) distPath = "./dist";
            else {
              console.error("Dist folder missing!");
              process.exit(1);
            }
          }

          console.log("Using distPath: " + distPath);
          fs.writeFileSync(process.env.GITHUB_ENV, "DIST_PATH=" + distPath + "\n", { flag: "a" });

          // Copy compiled outputs from all packages into web dist
          const searchDirs = [".", "packages", "apps"];
          searchDirs.forEach(parent => {
            if (!fs.existsSync(parent)) return;
            const entries = fs.readdirSync(parent, { withFileTypes: true });
            entries.forEach(dirent => {
              if (dirent.isDirectory() && !["node_modules", ".git"].includes(dirent.name)) {
                const moduleDist = path.join(parent, dirent.name, "dist");
                if (fs.existsSync(moduleDist) && path.resolve(moduleDist) !== path.resolve(distPath)) {
                  fs.cpSync(moduleDist, distPath, { recursive: true, force: true });
                  console.log("Synced module dist from: " + moduleDist);
                }
              }
            });
          });

          // Patch index.html to ensure window.__ModuleLoader__ bootstrap facade exists before main JS execution
          const htmlPath = path.join(distPath, "index.html");
          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            const bootFacade = `
            <script>
              window.__ModuleLoader__ = window.__ModuleLoader__ || {
                plugins: [],
                modules: new Map(),
                register: function(name, mod) { this.modules.set(name, mod); },
                get: function(name) { return this.modules.get(name); },
                load: function(name) { return Promise.resolve(this.get(name)); },
                init: function() { return Promise.resolve(); }
              };
            </script>
            `;

            if (!html.includes("__ModuleLoader__")) {
              html = html.replace("<head>", "<head>\n" + bootFacade);
              fs.writeFileSync(htmlPath, html);
              console.log("Successfully injected __ModuleLoader__ bootstrap facade into index.html");
            }
          }
          '

      - name: Disable Jekyll
        run: |
          touch ${{ env.DIST_PATH }}/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
