name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client || pnpm --filter @deepseek-ai/dsh-client run build || true
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Sync Root Modules and Assets into Web Dist
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          if (!fs.existsSync(distPath)) {
            console.error("distPath does not exist!");
            process.exit(1);
          }

          // 1. Copy all build outputs from root module folders (boot, client, core, bundle, etc.)
          const rootDirs = fs.readdirSync(".", { withFileTypes: true });
          rootDirs.forEach(dirent => {
            if (dirent.isDirectory() && !["node_modules", ".git", "apps"].includes(dirent.name)) {
              const moduleDist = path.join(dirent.name, "dist");
              if (fs.existsSync(moduleDist)) {
                fs.cpSync(moduleDist, distPath, { recursive: true, force: true });
                console.log("Successfully copied dist from: " + moduleDist);
              }
            }
          });

          // 2. Ensure Proxy Fallback exists inside index.html in case a specific module file is missing
          const htmlPath = path.join(distPath, "index.html");
          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            const safeProxyShim = `
            <script>
              (function() {
                function createProxy(obj) {
                  return new Proxy(obj || function() {}, {
                    get: function(target, prop) {
                      if (prop === "plugins") return [];
                      if (prop in target) return target[prop];
                      return createProxy(function() { return createProxy({}); });
                    },
                    apply: function(target, thisArg, argArray) {
                      return createProxy({});
                    }
                  });
                }

                if (!window.__ModuleLoader__) {
                  var loader = createProxy({
                    plugins: [],
                    create: function() { return createProxy({}); }
                  });
                  window.__ModuleLoader__ = loader;
                }
              })();
            </script>
            `;

            html = html.replace("<head>", "<head>\n" + safeProxyShim);
            fs.writeFileSync(htmlPath, html);
            console.log("Successfully injected proxy shim into index.html");
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
