name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo libraries & web app
        env:
          BASE_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          # Build the web app workspace specifically for production static hosting
          pnpm --filter @deepseek-ai/dsh-web build || pnpm --filter web build || pnpm run build:web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Locate & Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Targets the web app dist directory inside the monorepo workspace
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
