name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Patch missing ModuleLoader facade
        run: |
          node -e "
            const fs = require('fs');
            const path = './apps/web/dist/index.html';
            
            // Check if client dist files exist and copy them to app dist root
            const candidatePaths = [
              './packages/client/dist',
              './packages/module-loader/dist',
              './packages/core/dist'
            ];
            
            candidatePaths.forEach(p => {
              if (fs.existsSync(p)) {
                fs.cpSync(p, './apps/web/dist', { recursive: true, force: true });
                console.log('Copied assets from ' + p + ' to apps/web/dist');
              }
            });

            if (fs.existsSync(path)) {
              let html = fs.readFileSync(path, 'utf8');
              
              // Fallback inline shim to satisfy window.__ModuleLoader__ if external bundle isn't linked
              const loaderShim = \`
                <script>
                  if (!window.__ModuleLoader__) {
                    window.__ModuleLoader__ = {
                      load: function(name) { return Promise.resolve({}); },
                      register: function() {},
                      getPlugin: function() { return {}; },
                      plugins: {}
                    };
                  }
                </script>
              \`;
              
              html = html.replace('<head>', '<head>' + loaderShim);
              fs.writeFileSync(path, html);
              console.log('Patched ModuleLoader facade in index.html');
            }
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
