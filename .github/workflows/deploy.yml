name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          # Build all underlying monorepo packages first (boot, client, core)
          pnpm run build
          # Build the static web app
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Link Real Compiled Modules into HTML
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          const htmlPath = path.join(distPath, "index.html");

          if (!fs.existsSync(distPath)) {
            console.error("Dist folder does not exist!");
            process.exit(1);
          }

          // 1. Copy real compiled dist folders from root packages (boot, client, core, etc.) into apps/web/dist
          const rootDirs = fs.readdirSync(".", { withFileTypes: true });
          const jsFilesToInject = [];

          rootDirs.forEach(dirent => {
            if (dirent.isDirectory() && !["node_modules", ".git", "apps"].includes(dirent.name)) {
              const moduleDist = path.join(dirent.name, "dist");
              if (fs.existsSync(moduleDist)) {
                fs.cpSync(moduleDist, distPath, { recursive: true, force: true });
                
                // Track real JS files generated by boot/client modules
                const distFiles = fs.readdirSync(moduleDist);
                distFiles.forEach(f => {
                  if (f.endsWith(".js")) {
                    jsFilesToInject.push(f);
                  }
                });
                console.log("Copied real package dist from: " + moduleDist);
              }
            }
          });

          // 2. Inject real script tags pointing to compiled bootstrap scripts
          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            let realScriptTags = "";
            jsFilesToInject.forEach(file => {
              realScriptTags += `<script src="/deepseek-harness-web/${file}"></script>\n`;
            });

            html = html.replace("<head>", "<head>\n" + realScriptTags);
            fs.writeFileSync(htmlPath, html);
            console.log("Injected real compiled script tags into index.html:", jsFilesToInject);
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
