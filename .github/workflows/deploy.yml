name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Inject Complete Plugin Loader Shim
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          const htmlPath = path.join(distPath, "index.html");

          // 1. Copy built package assets
          const packagesDir = "./packages";
          if (fs.existsSync(packagesDir)) {
            fs.readdirSync(packagesDir).forEach(pkg => {
              const pkgDist = path.join(packagesDir, pkg, "dist");
              if (fs.existsSync(pkgDist)) {
                fs.cpSync(pkgDist, distPath, { recursive: true, force: true });
              }
            });
          }

          // 2. Inject complete non-crashing ModuleLoader mock
          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            const inlineShim = `
            <script>
              (function() {
                function buildLoaderInstance(opts) {
                  var options = opts || {};
                  var pluginsList = options.plugins || [];
                  var pluginsMap = {};
                  
                  if (Array.isArray(pluginsList)) {
                    pluginsList.forEach(function(p) {
                      if (p && p.name) pluginsMap[p.name] = p;
                    });
                  } else if (typeof pluginsList === "object") {
                    pluginsMap = pluginsList;
                  }

                  return {
                    plugins: pluginsMap,
                    pluginsList: Array.isArray(pluginsList) ? pluginsList : [],
                    config: { plugins: pluginsList },
                    worker: { plugins: [] },
                    load: function() { return Promise.resolve(this); },
                    loadPlugin: function() { return Promise.resolve({}); },
                    getPlugin: function(n) { return pluginsMap[n] || {}; },
                    register: function(n, p) { pluginsMap[n] = p; }
                  };
                }

                var defaultInstance = buildLoaderInstance({ plugins: [] });
                defaultInstance.create = function(opts) {
                  return buildLoaderInstance(opts);
                };

                if (!window.__ModuleLoader__) {
                  window.__ModuleLoader__ = defaultInstance;
                }
              })();
            </script>
            `;

            html = html.replace("<head>", "<head>\n" + inlineShim);
            fs.writeFileSync(htmlPath, html);
            console.log("Successfully injected robust ModuleLoader shim into index.html");
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
