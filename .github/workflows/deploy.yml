name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Inject Error Debugger into HTML
        run: |
          node -e "
            const fs = require('fs');
            const path = './apps/web/dist/index.html';
            if (fs.existsSync(path)) {
              let html = fs.readFileSync(path, 'utf8');
              const debugScript = \`
                <script>
                  window.addEventListener('error', function(e) {
                    let errDiv = document.getElementById('debug-err') || document.createElement('div');
                    errDiv.id = 'debug-err';
                    errDiv.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:red;font-family:monospace;padding:20px;z-index:999999;overflow:auto;white-space:pre-wrap;word-break:break-all;';
                    errDiv.innerHTML += '=== ERROR RECORDED ===\\nMessage: ' + e.message + '\\nSource: ' + e.filename + ':' + e.lineno + ':' + e.colno + '\\nStack: ' + (e.error ? e.error.stack : 'N/A') + '\\n\\n';
                    document.body.appendChild(errDiv);
                  });
                  window.addEventListener('unhandledrejection', function(e) {
                    let errDiv = document.getElementById('debug-err') || document.createElement('div');
                    errDiv.id = 'debug-err';
                    errDiv.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:red;font-family:monospace;padding:20px;z-index:999999;overflow:auto;white-space:pre-wrap;word-break:break-all;';
                    errDiv.innerHTML += '=== UNHANDLED REJECTION ===\\nReason: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '\\n\\n';
                    document.body.appendChild(errDiv);
                  });
                  console.log('Window ModuleLoader check:', window.__ModuleLoader__);
                </script>
              \`;
              html = html.replace('<head>', '<head>' + debugScript);
              fs.readFileSync && fs.writeFileSync(path, html);
              console.log('Successfully injected error debugger into dist/index.html');
            }
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
