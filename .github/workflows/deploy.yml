name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          pnpm run build
          pnpm run build:lib:client
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Sync Plugins and Complete ModuleLoader API
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          const htmlPath = path.join(distPath, "index.html");

          // Copy all built package dist files into web dist
          const packagesDir = "./packages";
          if (fs.existsSync(packagesDir)) {
            fs.readdirSync(packagesDir).forEach(pkg => {
              const pkgDist = path.join(packagesDir, pkg, "dist");
              if (fs.existsSync(pkgDist)) {
                fs.cpSync(pkgDist, distPath, { recursive: true, force: true });
              }
            });
          }

          // Copy plugins directory if present
          const pluginsDir = "./plugins";
          if (fs.existsSync(pluginsDir)) {
            fs.cpSync(pluginsDir, path.join(distPath, "plugins"), { recursive: true, force: true });
          }

          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            // Full interface structure satisfying window.__ModuleLoader__.create().plugins
            const inlineShim = `
            <script>
              (function() {
                function buildLoader() {
                  var registry = {
                    plugins: {},
                    list: function() { return []; },
                    get: function(n) { return registry.plugins[n] || {}; },
                    register: function(n, p) { registry.plugins[n] = p; }
                  };
                  return {
                    plugins: registry.plugins,
                    registry: registry,
                    config: { plugins: {} },
                    load: function() { return Promise.resolve(registry); },
                    loadPlugin: function() { return Promise.resolve({}); },
                    getPlugin: function(n) { return registry.plugins[n] || {}; },
                    register: function(n, p) { registry.plugins[n] = p; }
                  };
                }

                var loader = buildLoader();
                loader.create = buildLoader;
                window.__ModuleLoader__ = loader;
              })();
            </script>
            `;

            html = html.replace("<head>", "<head>\n" + inlineShim);
            fs.writeFileSync(htmlPath, html);
            console.log("Successfully patched ModuleLoader interface and plugins into index.html");
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
