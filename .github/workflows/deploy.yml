name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build monorepo & web bundle
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
        run: |
          # 1. Build all base monorepo packages first
          pnpm run build
          pnpm run build:lib:client || pnpm --filter @deepseek-ai/dsh-client run build || true

          # 2. Build the web app with the subpath base argument
          pnpm --filter @deepseek-ai/dsh-web run build -- --base=/deepseek-harness-web/ || \
          pnpm --filter web run build -- --base=/deepseek-harness-web/ || \
          pnpm --filter ./apps/web run build -- --base=/deepseek-harness-web/

      - name: Determine Output Directory & Sync Root Modules
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          // Locate output dist folder
          let distPath = "./apps/web/dist";
          if (!fs.existsSync(distPath)) {
            if (fs.existsSync("./packages/web/dist")) distPath = "./packages/web/dist";
            else if (fs.existsSync("./dist")) distPath = "./dist";
            else {
              console.error("No valid dist directory found!");
              process.exit(1);
            }
          }

          console.log("Target build path: " + distPath);
          fs.writeFileSync(process.env.GITHUB_ENV, "DIST_PATH=" + distPath + "\n", { flag: "a" });

          // Copy built outputs from root/sibling modules (packages/apps) into target dist
          const searchDirs = [".", "packages", "apps"];
          searchDirs.forEach(parent => {
            if (!fs.existsSync(parent)) return;
            const entries = fs.readdirSync(parent, { withFileTypes: true });
            entries.forEach(dirent => {
              if (dirent.isDirectory() && !["node_modules", ".git"].includes(dirent.name)) {
                const moduleDist = path.join(parent, dirent.name, "dist");
                if (fs.existsSync(moduleDist) && path.resolve(moduleDist) !== path.resolve(distPath)) {
                  fs.cpSync(moduleDist, distPath, { recursive: true, force: true });
                  console.log("Successfully copied dist from: " + moduleDist);
                }
              }
            });
          });
          '

      - name: Disable Jekyll Engine
        run: |
          touch ${{ env.DIST_PATH }}/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
