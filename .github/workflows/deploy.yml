name: Deploy DeepSeek Harness to GitHub Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone DeepSeek Harness
        run: |
          git clone https://github.com/deepseek-ai/deepseek-harness.git .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Monorepo & Web Application
        env:
          BASE_URL: /deepseek-harness-web/
          PUBLIC_URL: /deepseek-harness-web/
          VITE_BASE_URL: /deepseek-harness-web/
          NODE_ENV: production
        run: |
          # 1. Compile all underlying core packages (boot, client, shell, etc.)
          pnpm run build

          # 2. Compile web application
          pnpm --filter @deepseek-ai/dsh-web run build || pnpm --filter web run build

      - name: Sync Production Bundles & Link Real Bootloader
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const distPath = "./apps/web/dist";
          const htmlPath = path.join(distPath, "index.html");

          if (!fs.existsSync(distPath)) {
            console.error("apps/web/dist not found!");
            process.exit(1);
          }

          // Disable GitHub Pages Jekyll processing
          fs.writeFileSync(path.join(distPath, ".nojekyll"), "");

          // 1. Sync all compiled dist output directories from root module packages into web dist
          const rootEntries = fs.readdirSync(".", { withFileTypes: true });
          const bootScripts = [];

          rootEntries.forEach(entry => {
            if (entry.isDirectory() && !["node_modules", ".git", "apps"].includes(entry.name)) {
              const moduleDist = path.join(entry.name, "dist");
              if (fs.existsSync(moduleDist)) {
                fs.cpSync(moduleDist, distPath, { recursive: true, force: true });
                
                // Track real compiled entry scripts from boot/client
                const files = fs.readdirSync(moduleDist);
                files.forEach(f => {
                  if (f.endsWith(".js") && (f.includes("boot") || f.includes("loader") || f.includes("client"))) {
                    bootScripts.push(f);
                  }
                });
                console.log("Synced real module assets from: " + moduleDist);
              }
            }
          });

          // 2. Inject real compiled script tags synchronously in <head>
          if (fs.existsSync(htmlPath)) {
            let html = fs.readFileSync(htmlPath, "utf8");

            // Deduplicate and prioritize primary bootloader script
            const uniqueBootScripts = Array.from(new Set(bootScripts)).sort((a, b) => {
              if (a.includes("boot") || a.includes("loader")) return -1;
              return 1;
            });

            let realTags = "";
            uniqueBootScripts.forEach(script => {
              realTags += `<script src="/deepseek-harness-web/${script}"></script>\n`;
            });

            // Inject BEFORE any Vite module script executes
            html = html.replace("<head>", "<head>\n" + realTags);
            fs.writeFileSync(htmlPath, html);
            console.log("Linked real production boot script tags:", uniqueBootScripts);
          }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/web/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
